<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17072d"><title>AGT MOD — Prévia</title>
<style>
:root{--line:rgba(210,170,255,.24)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff}body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 20%,#7838b8 0,#34105f 32%,#120821 72%,#080511 100%);display:grid;place-items:center;padding:22px}.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,rgba(15,4,34,.08),rgba(4,2,13,.72))}.cloud{position:absolute;width:390px;height:110px;border-radius:100px;background:linear-gradient(180deg,#b783ed66,#52217d33);filter:blur(17px);opacity:.7}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:170px;height:150px;left:55px;top:-68px}.cloud:after{width:210px;height:180px;right:48px;top:-90px}.c1{top:12%;left:-90px}.c2{top:27%;right:-130px;transform:scale(.8)}.c3{bottom:7%;left:18%;transform:scale(1.15);opacity:.35}.bolt{position:absolute;top:12%;right:17%;width:7px;height:210px;background:linear-gradient(transparent,#b7eaff,#fff,transparent);filter:drop-shadow(0 0 9px #8be9ff);transform:rotate(17deg);opacity:.7;clip-path:polygon(45% 0,100% 0,57% 43%,90% 43%,0 100%,35% 52%,8% 52%)}.bolt.two{top:48%;left:12%;height:150px;transform:rotate(-12deg);opacity:.36}.embers{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#c99aff 1px,transparent 1px);background-size:130px 130px,190px 190px;background-position:0 0,50px 70px;opacity:.25}.shell{position:relative;width:min(100%,440px);padding:34px 30px 26px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(155deg,rgba(46,20,76,.88),rgba(17,9,35,.76));box-shadow:0 25px 90px #05020dcc,0 0 50px #a855f733,inset 0 1px #ffffff22;backdrop-filter:blur(13px);text-align:center}.tag{font-size:10px;letter-spacing:5px;color:#d9b8ff;text-transform:uppercase;font-weight:bold}.brand{margin:8px 0 0;font-size:clamp(68px,18vw,92px);font-weight:1000;letter-spacing:5px;line-height:.92;color:#e9edf7;background:linear-gradient(180deg,#fff 5%,#c5cbd9 42%,#717b91 52%,#f4f6ff 75%,#7f879b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #37304c) drop-shadow(0 0 18px #d5b7ff66);transform:perspective(220px) rotateX(7deg)}.arena{font-size:15px;letter-spacing:9px;text-transform:uppercase;color:#d9c8f2;margin:8px 0 27px 8px;text-shadow:0 0 13px #bc78ff}.field{text-align:left;margin:14px 0}.field label{display:block;font-size:10px;letter-spacing:2px;color:#cdb7e6;margin:0 0 8px 5px;text-transform:uppercase;font-weight:bold}input,select{width:100%;height:49px;border:1px solid #8f61b866;border-radius:12px;background:#10091f;color:white;padding:0 15px;font-size:15px;outline:none}input:focus,select:focus{border-color:#c58aff;box-shadow:0 0 0 3px #a855f72b}select option{background:#170d28}.skin-row{display:flex;gap:9px}.skin{height:40px;flex:1;border:2px solid #ffffff22;border-radius:10px;cursor:pointer;background:var(--skin);box-shadow:inset 0 0 12px #fff3}.skin.active{border-color:white;outline:2px solid #b76cff;outline-offset:2px}.play{width:100%;height:58px;margin:22px 0 12px;border:0;border-radius:14px;color:#180827;font-weight:1000;letter-spacing:2px;font-size:17px;cursor:pointer;background:linear-gradient(100deg,#f3dcff,#bd7bff 48%,#8deaff);box-shadow:0 8px 28px #a855f755,inset 0 1px #fff;transition:.2s}.play:hover{transform:translateY(-2px);filter:brightness(1.1)}.settings{border:1px solid #c69bfa66;background:#ffffff0a;color:#e8d9ff;border-radius:12px;padding:11px 22px;font-weight:bold;letter-spacing:2px;cursor:pointer}.settings:hover{background:#ffffff16}.note{font-size:10px;letter-spacing:1px;color:#a99ab9;margin-top:22px}.demo{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#8d52b52b;color:#ead8ff;font-size:12px;line-height:1.5}.demo.show{display:block}@media(max-width:390px){body{padding:12px}.shell{padding:27px 21px 22px;border-radius:22px}.arena{margin-bottom:22px}}

body{background:radial-gradient(ellipse at 50% 38%,#30104e 0%,#170b26 38%,#09060f 76%,#050409 100%)}
.ambient{background:radial-gradient(ellipse at 14% 25%,#8e31e51c,transparent 34%),radial-gradient(ellipse at 88% 74%,#a855f71c,transparent 36%)}
.cloud,.bolt,.embers{display:none}
.glow{position:absolute;border-radius:50%;filter:blur(65px);opacity:.45;animation:float 9s ease-in-out infinite alternate}
.glow.one{width:300px;height:300px;left:-90px;top:5%;background:#8b28e8}
.glow.two{width:340px;height:340px;right:-120px;bottom:0;background:#5412a8;animation-delay:-4s}
.ring{position:absolute;width:min(76vw,660px);aspect-ratio:1;border:1px solid #b45cff20;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 55px #8b2be51a,inset 0 0 55px #8b2be511}
.ring:before,.ring:after{content:"";position:absolute;inset:8%;border:1px solid #c77aff16;border-radius:50%}
.ring:after{inset:19%;border-color:#c77aff12}
.neon-line{position:absolute;height:2px;width:42vw;max-width:540px;background:linear-gradient(90deg,transparent,#9e45ef77,#e4c4ffbb,#9e45ef77,transparent);filter:drop-shadow(0 0 8px #a855f7);opacity:.7;transform:rotate(-23deg);top:25%;left:-5%}
.neon-line.second{top:auto;left:auto;right:-8%;bottom:22%;transform:rotate(-23deg);opacity:.4}
.dots{position:absolute;inset:0;background-image:radial-gradient(#e8d5ff 1px,transparent 1px);background-size:95px 95px;opacity:.13}
@keyframes float{to{transform:translate3d(28px,-22px,0) scale(1.12)}}
</style></head><body><div class="sky"><div class="glow one"></div><div class="glow two"></div><div class="ring"></div><div class="neon-line"></div><div class="neon-line second"></div><div class="dots"></div></div>
<main class="shell"><div class="brand">AGT</div><div class="arena">ARENA</div>
<div class="field"><label for="nick">Nickname</label><input id="nick" maxlength="24" placeholder="Digite seu nickname" autocomplete="nickname"></div>
<div class="field"><label for="server">Servidor</label><select id="server"><option value="Brasil">Brasil</option></select></div>

<button class="play" id="play">▶ &nbsp; PLAY ONLINE</button><button class="settings" id="settings">⚙ &nbsp; SETTINGS</button><div class="demo" id="demo"></div><div class="note">AGT MOD • PRÉVIA VISUAL 0.1</div></main>
<script>

const demo=document.getElementById("demo");
document.getElementById("play").addEventListener("click",()=>{const nick=document.getElementById("nick").value.trim();demo.classList.add("show");demo.textContent=nick?("Prévia: "+nick+" • "+document.getElementById("server").value+"+". O jogo online ainda não está conectado nesta demonstração."):"Digite seu nickname para visualizar a configuração de entrada. O jogo online ainda não está conectado nesta demonstração.";});
document.getElementById("settings").addEventListener("click",()=>{demo.classList.add("show");demo.textContent="Painel de configurações: esta área será detalhada depois que você aprovar o visual da tela inicial.";});
</script></body></html>
